<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sơ Đồ Chỗ Ngồi Lớp Học | Realtime Matrix</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & FontAwesome 6 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Firebase v9 Compat SDKs (Tự động kết nối Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-deep: #05060b;
      --bg-canvas: #090a12;
      --bg-panel: rgba(14, 17, 29, 0.85);
      --bg-panel-solid: #0d101d;
      --bg-box: rgba(0, 0, 0, 0.5);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border-panel: rgba(255, 255, 255, 0.1);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --grid-color: rgba(255, 255, 255, 0.035);
      --dock-bg: rgba(15, 18, 32, 0.85);
      --dock-border: rgba(99, 102, 241, 0.35);

      --c-group-1: #38bdf8;
      --c-group-2: #34d399;
      --c-group-3: #fbbf24;
      --c-group-4: #f43f5e;

      --active-accent: #6366f1;
      --chart-max-width: 1040px;
      --chart-width-pct: 95%;
    }

    [data-theme="light"] {
      --bg-deep: #f1f5f9;
      --bg-canvas: #e2e8f0;
      --bg-panel: rgba(255, 255, 255, 0.95);
      --bg-panel-solid: #ffffff;
      --bg-box: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border-panel: rgba(0, 0, 0, 0.12);
      --border-subtle: rgba(0, 0, 0, 0.06);
      --grid-color: rgba(15, 23, 42, 0.04);
      --dock-bg: rgba(255, 255, 255, 0.95);
      --dock-border: rgba(99, 102, 241, 0.4);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    .cyber-grid-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -3;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 34px 34px;
      pointer-events: none;
    }

    .right-edge-dock {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      background: var(--dock-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--dock-border);
      border-radius: 36px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
      z-index: 1000;
    }

    .dock-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-panel);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--active-accent);
      transform: scale(1.08);
    }

    #chartWrapper {
      max-width: var(--chart-max-width);
      width: var(--chart-width-pct);
      margin: 0 auto;
      transition: all 0.3s;
    }

    .chart-container-glass {
      background: var(--bg-panel);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-panel);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .desk-card {
      position: relative;
      background: var(--bg-box);
      border-radius: 16px;
      border: 1px solid;
      padding: 3px 5px 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .neon-group-1 { border-color: var(--c-group-1) !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.15); }
    .neon-group-2 { border-color: var(--c-group-2) !important; box-shadow: 0 0 10px rgba(52, 211, 153, 0.15); }
    .neon-group-3 { border-color: var(--c-group-3) !important; box-shadow: 0 0 10px rgba(251, 191, 36, 0.15); }
    .neon-group-4 { border-color: var(--c-group-4) !important; box-shadow: 0 0 10px rgba(244, 63, 94, 0.15); }

    .group-text-direct {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      pointer-events: none;
    }

    .seat-avatar-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s, border-color 0.2s;
      background: var(--bg-box);
    }
    @media (min-width: 640px) {
      .seat-avatar-circle {
        width: 78px;
        height: 78px;
      }
    }
    .seat-slot:hover .seat-avatar-circle {
      transform: scale(1.05);
      border-color: var(--active-accent);
    }

    .seat-name {
      display: block;
      width: 100%;
      text-align: center;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 3px;
      font-size: 11px;
      color: var(--text-main);
    }

    .cloud-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid;
    }
    .cloud-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }
    .cloud-offline {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }

    #toastNotification {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
      z-index: 9999;
    }
    #toastNotification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media print {
      .no-print, header, .right-edge-dock, .cyber-grid-bg {
        display: none !important;
      }
      body { background: white !important; color: black !important; }
      #chartContainer { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white pb-14">

  <div class="cyber-grid-bg"></div>

  <!-- Header -->
  <header class="no-print sticky top-0 z-40 bg-[var(--bg-panel)] backdrop-blur-xl border-b border-[var(--border-panel)] shadow-sm">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between gap-2 overflow-x-auto whitespace-nowrap">
      
      <div class="flex items-center gap-2 shrink-0 pr-2 border-r border-[var(--border-panel)]">
        <div class="flex flex-col">
          <span class="text-xs font-black uppercase text-[var(--text-main)] font-mono">SƠ ĐỒ LỚP HỌC</span>
          <div id="cloudStatusBadge" class="cloud-badge cloud-online" title="Dữ liệu kết nối tự động với Cloud Firebase">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 
            <span id="cloudStatusText">Đã kết nối Cloud</span>
          </div>
        </div>
      </div>

      <!-- Chọn lớp & Nút Quản lý -->
      <div class="flex items-center gap-1.5 shrink-0">
        <select id="classProfileSelect" onchange="switchClassProfile(this.value)" class="h-8 text-xs bg-[var(--bg-box)] border border-[var(--border-panel)] rounded-xl px-2 font-bold text-[var(--text-main)] focus:outline-none focus:border-indigo-500 cursor-pointer">
          <option value="7A1">Lớp 7A1</option>
        </select>
        <button onclick="pushStateToFirebase()" class="h-8 px-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-xl shadow-md transition flex items-center gap-1.5" title="Đẩy toàn bộ lên đám mây">
          <i class="fa-solid fa-cloud-arrow-up text-[11px]"></i> Đồng bộ
        </button>
      </div>

      <!-- Góc nhìn -->
      <div class="flex items-center gap-1 shrink-0 px-2 border-l border-r border-[var(--border-panel)]">
        <button id="btnPerspStudent" onclick="setPerspective('student')" class="h-8 px-2.5 text-[11px] font-bold rounded-xl transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-md">
          <i class="fa-solid fa-person-chalkboard text-[10px]"></i> HS nhìn lên
        </button>
        <button id="btnPerspTeacherInv" onclick="setPerspective('teacher_inverted')" class="h-8 px-2.5 text-[11px] font-bold rounded-xl transition flex items-center gap-1.5 bg-[var(--bg-box)] hover:bg-white/10 text-[var(--text-sub)] border border-[var(--border-panel)]">
          <i class="fa-solid fa-arrows-rotate text-[10px]"></i> GV nhìn xuống
        </button>
      </div>

      <!-- Tìm kiếm -->
      <div class="relative shrink-0 w-36 sm:w-44">
        <input type="text" id="studentSearchInput" oninput="handleStudentSearch(this.value)" placeholder="Tìm học sinh..." class="w-full h-8 pl-7 pr-2.5 text-xs bg-[var(--bg-box)] border border-[var(--border-panel)] rounded-xl focus:outline-none focus:border-indigo-500 text-[var(--text-main)]">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-[11px] text-[var(--text-muted)]"></i>
      </div>

      <!-- Tác vụ -->
      <div class="flex items-center gap-1.5 shrink-0 pl-1 border-l border-[var(--border-panel)]">
        <button onclick="exportCurrentImage()" id="btnExportImg" class="h-8 px-3 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-xl shadow-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-image text-[11px]"></i> Xuất Ảnh
        </button>
        <button onclick="window.print()" class="h-8 px-3 bg-slate-800 hover:bg-slate-700 text-white text-[11px] font-bold rounded-xl shadow-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-print text-[11px]"></i> In A4
        </button>
      </div>

    </div>
  </header>

  <!-- Dock công cụ bên phải -->
  <div class="right-edge-dock no-print">
    <button class="dock-btn" onclick="cycleTheme()" title="Đổi màu nền (Sáng / Tối)">
      <span id="themeIcon">🌙</span>
    </button>
    <button class="dock-btn" onclick="toggleFullScreen()" title="Toàn màn hình">
      <span>⛶</span>
    </button>
  </div>

  <!-- Bố cục chính -->
  <main class="pt-4 sm:pt-6 px-2 sm:px-4">
    <div id="chartWrapper">
      <div id="chartContainer" class="chart-container-glass p-3.5 sm:p-6 transition-all">
        
        <div class="text-center mb-1">
          <div id="yearCapsule" class="inline-flex items-center justify-center px-4 py-0.5 bg-[var(--bg-box)] border border-[var(--border-panel)] rounded-full text-indigo-400 font-extrabold text-[11px] sm:text-xs uppercase font-mono shadow-inner">
            <span>NĂM HỌC:&nbsp;</span>
            <input type="text" id="inputYear" value="2026 - 2027" onchange="saveMetaToCloud()" class="bg-transparent border-none focus:outline-none font-extrabold text-indigo-400 w-24 text-center cursor-pointer">
          </div>
        </div>

        <div class="text-center mb-2">
          <h1 class="text-lg sm:text-2xl font-black uppercase tracking-tight inline-flex items-center justify-center gap-2 text-[var(--text-main)]">
            <span>SƠ ĐỒ BỐ TRÍ CHỖ NGỒI LỚP</span>
            <span id="titleClassName" class="text-indigo-400 underline decoration-indigo-500/50 underline-offset-4 font-mono">7A1</span>
          </h1>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-6 text-xs sm:text-sm font-semibold text-[var(--text-sub)] mb-3 pb-3 border-b border-[var(--border-panel)]">
          <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-user-tie text-indigo-400"></i>
            <span>GVCN:</span>
            <input type="text" id="inputTeacherName" value="Man Thị Hồng Duy" onchange="saveMetaToCloud()" class="font-bold text-[var(--text-main)] border-b border-dashed border-[var(--border-panel)] focus:outline-none focus:border-indigo-500 bg-transparent px-1 py-0.5">
          </div>
          <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-users text-indigo-400"></i>
            <span>Sĩ số hiện tại:</span>
            <span id="studentCountBadge" class="inline-flex items-center justify-center px-2 py-0.5 min-w-[28px] bg-indigo-500/20 text-indigo-300 font-mono font-extrabold rounded-md text-xs border border-indigo-500/30">42</span>
            <span>học sinh</span>
          </div>
          <input type="hidden" id="inputClassName" value="7A1">
        </div>

        <div id="frontAreaContainer" class="mb-3.5"></div>
        <div id="columnHeaderContainer" class="grid grid-cols-4 gap-2 sm:gap-3 mb-2.5 text-center text-xs font-bold text-[var(--text-sub)]"></div>
        <div id="classroomGrid" class="space-y-2.5 sm:space-y-3"></div>
        <div id="bottomPodiumContainer" class="mt-3.5"></div>

        <div id="chartFooterLegend" class="mt-4 pt-3 border-t border-[var(--border-panel)] flex flex-wrap items-center justify-between text-[11px] text-[var(--text-muted)] gap-2 select-none">
          <div class="text-[11px] italic text-[var(--text-sub)] font-mono">
            * Nhấp đúp hoặc bấm vào ghế của bạn để <strong>điền Họ & Tên, tải ảnh chân dung</strong>. Dữ liệu sẽ lập tức được lưu lên Cloud cho cả lớp!
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Modal chỉnh sửa chỗ ngồi -->
  <div id="editSeatModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-50 hidden no-print">
    <div class="bg-[var(--bg-panel-solid)] rounded-2xl max-w-sm w-full mx-4 p-5 shadow-2xl border border-[var(--border-panel)] text-[var(--text-main)]">
      <div class="flex items-center justify-between pb-3 border-b border-[var(--border-panel)]">
        <h3 class="text-base font-black flex items-center gap-2">
          <i class="fa-solid fa-user-pen text-indigo-400"></i> Cập nhật thông tin học sinh
        </h3>
        <button onclick="closeEditModal()" class="w-7 h-7 rounded-full bg-white/5 hover:bg-white/10 text-[var(--text-sub)] flex items-center justify-center">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <div class="py-4 space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-[var(--text-sub)] mb-1">Vị trí bàn:</label>
          <div id="modalSeatPositionText" class="text-xs font-mono font-semibold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1.5 rounded-xl">Hàng 1 - Bàn 1</div>
        </div>

        <div>
          <label class="block text-xs font-bold text-[var(--text-sub)] mb-1">Họ và tên học sinh:</label>
          <input type="text" id="modalStudentNameInput" placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-3 py-2 text-sm bg-[var(--bg-box)] border border-[var(--border-panel)] rounded-xl focus:outline-none focus:border-indigo-500 font-semibold text-[var(--text-main)]">
        </div>

        <div>
          <label class="block text-xs font-bold text-[var(--text-sub)] mb-1">Ảnh chân dung:</label>
          <div class="flex items-center gap-3">
            <div id="modalAvatarPreviewCircle" class="w-14 h-14 rounded-full bg-[var(--bg-box)] border-2 border-dashed border-[var(--border-panel)] flex items-center justify-center overflow-hidden shrink-0 text-slate-500">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="flex-1 flex gap-2">
              <label class="px-3 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 rounded-xl text-xs font-bold cursor-pointer transition flex items-center gap-1.5">
                <i class="fa-solid fa-camera text-[11px]"></i> Chọn ảnh
                <input type="file" id="modalAvatarFileInput" accept="image/*" class="hidden" onchange="handleModalAvatarUpload(event)">
              </label>
              <button type="button" onclick="removeCurrentModalAvatar()" class="px-2.5 py-1.5 bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 rounded-xl text-xs font-bold transition flex items-center gap-1 border border-rose-500/30">
                <i class="fa-solid fa-trash-can text-[11px]"></i> Xóa ảnh
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="pt-3 border-t border-[var(--border-panel)] flex items-center justify-between">
        <button onclick="clearCurrentSeatSlot()" class="px-3 py-1.5 text-xs font-bold text-rose-400 hover:bg-rose-500/10 rounded-xl">
          <i class="fa-solid fa-user-xmark"></i> Bỏ trống
        </button>
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="px-3 py-1.5 text-xs font-bold text-[var(--text-sub)] bg-white/5 hover:bg-white/10 rounded-xl">Hủy</button>
          <button onclick="saveModalSeatDetails()" class="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl shadow-md flex items-center gap-1.5">
            <i class="fa-solid fa-cloud-arrow-up"></i> Lưu lên Cloud
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast thông báo -->
  <div id="toastNotification" class="px-4 py-2 bg-slate-900/90 text-white text-xs font-semibold rounded-full border border-indigo-500/50 shadow-2xl flex items-center gap-2">
    <span id="toastIcon" class="text-emerald-400"><i class="fa-solid fa-check"></i></span>
    <span id="toastMessage">Thông báo</span>
  </div>

  <script>
    /* ================= CẤU HÌNH FIREBASE REALTIME DATABASE CỦA BẠN ================= */
    const firebaseConfig = {
      apiKey: "AIzaSyDhql28Umh6j8H_nYORsUZiQmU4IZezloI",
      authDomain: "sodolophoc-179c8.firebaseapp.com",
      databaseURL: "https://sodolophoc-179c8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sodolophoc-179c8",
      storageBucket: "sodolophoc-179c8.firebasestorage.app",
      messagingSenderId: "219020916876",
      appId: "1:219020916876:web:893342cdccf0451c83e3a9",
      measurementId: "G-XXZSPM3JD6"
    };

    let firebaseDb = null;
    let isCloudConnected = false;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      firebaseDb = firebase.database();
      isCloudConnected = true;
      console.log("Firebase Realtime Database initialized successfully!");
    } catch (err) {
      console.error("Lỗi kết nối Firebase:", err);
    }

    const INITIAL_STUDENT_NAMES_7A1 = [
      ["Quốc Tuấn", "Bảo Nam"], ["", "Khánh Nhung"], ["", ""], ["", ""],
      ["", ""], ["", ""], ["", ""], ["", ""],
      ["", ""], ["", ""], ["", ""], ["", ""],
      ["Thanh Hà", "Trúc Phương"], ["Kim Trúc", "Như Quỳnh 24"], ["Thiên Lam", "Hoàng Thương"], ["Nhã Băng", "An An"],
      ["Phương Linh", "Thanh Lam"], ["Quang Thịnh", "Khả Ngân"], ["Anh Trọng", "Thành Danh"], ["Bích Thủy", "Thu Thảo"],
      ["Như Quỳnh 21", "Minh Đức"], ["Bảo Duy", "Gia Kiên"], ["Bảo Hân", "Bảo Sơn"], ["Thu Ngân", "Bảo Ngọc"]
    ];

    const GROUP_INFO = {
      1: { name: "T1", colorClass: "neon-group-1", textCol: "text-[var(--c-group-1)]" },
      2: { name: "T2", colorClass: "neon-group-2", textCol: "text-[var(--c-group-2)]" },
      3: { name: "T3", colorClass: "neon-group-3", textCol: "text-[var(--c-group-3)]" },
      4: { name: "T4", colorClass: "neon-group-4", textCol: "text-[var(--c-group-4)]" }
    };

    function getDefaultGroup(row, col) {
      if (col === 0 || col === 1) return row < 3 ? 1 : 2;
      return row < 3 ? 3 : 4;
    }

    function createDefaultClassGrid() {
      const grid = [];
      let deskCounter = 0;
      for (let r = 0; r < 6; r++) {
        const row = [];
        for (let c = 0; c < 4; c++) {
          const initPair = INITIAL_STUDENT_NAMES_7A1[deskCounter] || ["", ""];
          row.push({
            group: getDefaultGroup(r, c),
            seats: [
              { name: initPair[0] || "", avatar: "" },
              { name: initPair[1] || "", avatar: "" }
            ]
          });
          deskCounter++;
        }
        grid.push(row);
      }
      return grid;
    }

    let activeClassId = "7A1";
    let classGrid = createDefaultClassGrid();
    let currentPerspective = 'student';
    let editTarget = null;
    let tempAvatarBase64 = "";

    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');
      if (!toast) return;

      toastMsg.innerText = message;
      toastIcon.innerHTML = isSuccess ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function renderFrontAndPodium() {
      const frontContainer = document.getElementById('frontAreaContainer');
      const colContainer = document.getElementById('columnHeaderContainer');
      const bottomPodiumContainer = document.getElementById('bottomPodiumContainer');

      if (currentPerspective === 'student') {
        bottomPodiumContainer.innerHTML = '';
        frontContainer.innerHTML = `
          <div class="grid grid-cols-12 gap-2 sm:gap-3 items-center">
            <div class="col-span-3 sm:col-span-2">
              <div class="w-full py-2 px-2 bg-amber-500/10 border border-dashed border-amber-500/40 rounded-2xl text-center">
                <div class="text-amber-400 text-[11px] font-black uppercase font-mono"><i class="fa-solid fa-door-open"></i> CỬA VÀO</div>
                <div class="text-[9.5px] text-amber-300 font-medium">Cạnh cột 1</div>
              </div>
            </div>
            <div class="col-span-6 sm:col-span-8 flex justify-center">
              <div class="w-full max-w-xl py-2.5 px-4 bg-emerald-950/80 border-2 border-emerald-500/40 rounded-2xl text-center shadow-lg">
                <div class="flex items-center justify-center gap-2 text-emerald-300 text-xs sm:text-sm font-black tracking-widest uppercase font-mono">
                  <i class="fa-solid fa-chalkboard text-emerald-400"></i>
                  <span>BẢNG ĐEN LỚP HỌC</span>
                  <i class="fa-solid fa-chalkboard text-emerald-400"></i>
                </div>
              </div>
            </div>
            <div class="col-span-3 sm:col-span-2">
              <div class="w-full py-2 px-2 bg-amber-500/10 border-2 border-amber-500/40 rounded-2xl text-center">
                <div class="text-amber-400 text-[11px] font-black uppercase font-mono"><i class="fa-solid fa-graduation-cap"></i> BÀN GV</div>
                <div class="text-[9.5px] text-amber-300 font-medium">Đối diện cột 4</div>
              </div>
            </div>
          </div>
        `;
        colContainer.innerHTML = `
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 1 (Phía cửa)</div>
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 2</div>
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 3</div>
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 4 (Bàn GV)</div>
        `;
      } else {
        frontContainer.innerHTML = '';
        colContainer.innerHTML = `
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 4 (Bên trái GV)</div>
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 3</div>
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 2</div>
          <div class="py-1.5 px-2 bg-white/5 rounded-xl text-[var(--text-sub)] font-mono font-bold text-xs border border-[var(--border-panel)]">CỘT 1 (Bên phải GV)</div>
        `;
        bottomPodiumContainer.innerHTML = `
          <div class="pt-3 border-t border-[var(--border-panel)] text-center">
            <div class="text-xs font-mono font-bold text-indigo-400 mb-2">BỤC GIẢNG & VỊ TRÍ GIÁO VIÊN (GV NHÌN XUỐNG CẢ LỚP)</div>
          </div>
        `;
      }
    }

    function getInitials(name) {
      if (!name) return "";
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function renderClassroom() {
      const gridEl = document.getElementById('classroomGrid');
      if (!gridEl) return;
      gridEl.innerHTML = '';

      let totalStudents = 0;
      let rowIndices = currentPerspective === 'teacher_inverted' ? [5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5];
      let colIndices = currentPerspective === 'teacher_inverted' ? [3, 2, 1, 0] : [0, 1, 2, 3];
      let seatInvert = currentPerspective === 'teacher_inverted';

      rowIndices.forEach((rowIndex) => {
        const rowWrapper = document.createElement('div');
        rowWrapper.className = 'grid grid-cols-4 gap-2 sm:gap-3';

        colIndices.forEach((colIndex) => {
          const deskData = classGrid[rowIndex][colIndex];
          const groupMeta = deskData.group ? GROUP_INFO[deskData.group] : null;

          const deskCard = document.createElement('div');
          deskCard.className = `desk-card ${groupMeta ? groupMeta.colorClass : 'border-[var(--border-panel)]'}`;

          if (groupMeta) {
            const groupDirectText = document.createElement('div');
            groupDirectText.className = `group-text-direct ${groupMeta.textCol}`;
            groupDirectText.innerText = groupMeta.name;
            deskCard.appendChild(groupDirectText);
          }

          const seatsRow = document.createElement('div');
          seatsRow.className = 'grid grid-cols-2 gap-1 sm:gap-1.5 pt-0.5';

          const seatOrder = seatInvert ? [1, 0] : [0, 1];

          seatOrder.forEach((seatIdx) => {
            const student = deskData.seats[seatIdx];
            if (student.name && student.name.trim() !== '') totalStudents++;

            const seatSlot = document.createElement('div');
            seatSlot.className = 'seat-slot flex flex-col items-center justify-between p-1 rounded-2xl cursor-pointer hover:bg-white/5 transition';

            seatSlot.onclick = () => openEditModal(rowIndex, colIndex, seatIdx);

            const avatarWrapper = document.createElement('div');
            avatarWrapper.className = 'relative';

            const avatarCircle = document.createElement('div');
            avatarCircle.className = `seat-avatar-circle ${student.name ? 'border-white/40 text-indigo-300' : 'border-dashed border-white/20 text-slate-500'}`;

            if (student.avatar) {
              avatarCircle.innerHTML = `<img src="${student.avatar}" class="w-full h-full object-cover rounded-full" alt="${student.name}">`;
            } else if (student.name) {
              avatarCircle.innerHTML = `<span class="font-mono font-black text-sm sm:text-base">${getInitials(student.name)}</span>`;
            } else {
              avatarCircle.innerHTML = `<i class="fa-solid fa-plus text-xs opacity-40"></i>`;
            }

            avatarWrapper.appendChild(avatarCircle);
            seatSlot.appendChild(avatarWrapper);

            const nameEl = document.createElement('div');
            nameEl.className = 'seat-name truncate';
            nameEl.innerText = student.name || '[Trống]';
            if (!student.name) nameEl.className += ' text-[var(--text-muted)] font-normal italic text-[10px]';

            seatSlot.appendChild(nameEl);
            seatsRow.appendChild(seatSlot);
          });

          deskCard.appendChild(seatsRow);
          rowWrapper.appendChild(deskCard);
        });

        gridEl.appendChild(rowWrapper);
      });

      const countBadge = document.getElementById('studentCountBadge');
      if (countBadge) countBadge.innerText = totalStudents;
    }

    /* ================= THAO TÁC MODAL & TẢI ẢNH ================= */
    function openEditModal(row, col, seatIdx) {
      editTarget = { row, col, seatIdx };
      const student = classGrid[row][col].seats[seatIdx];

      document.getElementById('modalSeatPositionText').innerText = `Hàng ${row + 1} - Bàn ${col + 1} (Ghế ${seatIdx === 0 ? 'trái' : 'phải'})`;
      document.getElementById('modalStudentNameInput').value = student.name || '';
      tempAvatarBase64 = student.avatar || '';

      updateModalAvatarPreview();
      document.getElementById('editSeatModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modalStudentNameInput').focus(), 50);
    }

    function closeEditModal() {
      document.getElementById('editSeatModal').classList.add('hidden');
      editTarget = null;
      tempAvatarBase64 = "";
    }

    function updateModalAvatarPreview() {
      const avatarCircle = document.getElementById('modalAvatarPreviewCircle');
      if (tempAvatarBase64) {
        avatarCircle.innerHTML = `<img src="${tempAvatarBase64}" class="w-full h-full object-cover">`;
      } else {
        avatarCircle.innerHTML = `<i class="fa-solid fa-user"></i>`;
      }
    }

    function handleModalAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      // Nén ảnh để giảm dung lượng tải cực nhanh lên Firebase
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 160;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          } else {
            if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          tempAvatarBase64 = canvas.toDataURL('image/jpeg', 0.82);
          updateModalAvatarPreview();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeCurrentModalAvatar() {
      tempAvatarBase64 = "";
      updateModalAvatarPreview();
    }

    function clearCurrentSeatSlot() {
      if (!editTarget) return;
      saveSeatToFirebase(editTarget.row, editTarget.col, editTarget.seatIdx, { name: "", avatar: "" });
      closeEditModal();
      showToast("Đã làm trống ghế!");
    }

    function saveModalSeatDetails() {
      if (!editTarget) return;
      const newName = document.getElementById('modalStudentNameInput').value.trim();
      const updatedSeat = {
        name: newName,
        avatar: tempAvatarBase64
      };

      saveSeatToFirebase(editTarget.row, editTarget.col, editTarget.seatIdx, updatedSeat);
      closeEditModal();
      showToast("Đã lưu & đồng bộ thành công!");
    }

    /* ================= ĐỒNG BỘ CLOUD VỚI FIREBASE ================= */
    function saveSeatToFirebase(r, c, seatIdx, seatData) {
      classGrid[r][c].seats[seatIdx] = seatData;
      renderClassroom();

      if (isCloudConnected && firebaseDb) {
        firebaseDb.ref(`classes/${activeClassId}/grid/${r}/${c}/seats/${seatIdx}`).set(seatData)
          .catch(err => console.error("Lỗi đồng bộ ghế:", err));
      }
    }

    function saveMetaToCloud() {
      const tName = document.getElementById('inputTeacherName').value.trim();
      const yr = document.getElementById('inputYear').value.trim();

      if (isCloudConnected && firebaseDb) {
        firebaseDb.ref(`classes/${activeClassId}/meta`).update({
          teacherName: tName,
          year: yr
        });
      }
    }

    function pushStateToFirebase() {
      if (!isCloudConnected || !firebaseDb) {
        showToast("Chưa kết nối Cloud!", false);
        return;
      }
      const tName = document.getElementById('inputTeacherName').value.trim();
      const yr = document.getElementById('inputYear').value.trim();

      firebaseDb.ref(`classes/${activeClassId}`).set({
        className: activeClassId,
        teacherName: tName,
        year: yr,
        grid: classGrid
      }).then(() => {
        showToast("Đã đồng bộ toàn bộ lên Cloud!");
      }).catch(err => {
        console.error(err);
        showToast("Lỗi đồng bộ!", false);
      });
    }

    // Lắng nghe dữ liệu thay đổi từ Cloud và cập nhật ngay lên màn hình
    function listenToFirebaseCloud() {
      if (!isCloudConnected || !firebaseDb) return;

      const classRef = firebaseDb.ref(`classes/${activeClassId}`);
      classRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          if (data.grid) {
            classGrid = data.grid;
            renderClassroom();
          }
          if (data.meta) {
            if (data.meta.teacherName) document.getElementById('inputTeacherName').value = data.meta.teacherName;
            if (data.meta.year) document.getElementById('inputYear').value = data.meta.year;
          }
        } else {
          // Khởi tạo dữ liệu mẫu lên Cloud nếu trên Cloud chưa có
          pushStateToFirebase();
        }
      });
    }

    function setPerspective(persp) {
      currentPerspective = persp;
      const btnStudent = document.getElementById('btnPerspStudent');
      const btnTeacherInv = document.getElementById('btnPerspTeacherInv');

      if (persp === 'student') {
        btnStudent.className = 'h-8 px-2.5 text-[11px] font-bold rounded-xl transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-md';
        btnTeacherInv.className = 'h-8 px-2.5 text-[11px] font-bold rounded-xl transition flex items-center gap-1.5 bg-[var(--bg-box)] hover:bg-white/10 text-[var(--text-sub)] border border-[var(--border-panel)]';
      } else {
        btnTeacherInv.className = 'h-8 px-2.5 text-[11px] font-bold rounded-xl transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-md';
        btnStudent.className = 'h-8 px-2.5 text-[11px] font-bold rounded-xl transition flex items-center gap-1.5 bg-[var(--bg-box)] hover:bg-white/10 text-[var(--text-sub)] border border-[var(--border-panel)]';
      }

      renderFrontAndPodium();
      renderClassroom();
    }

    function handleStudentSearch(keyword) {
      const q = keyword.trim().toLowerCase();
      const allSeatSlots = document.querySelectorAll('.seat-slot');
      allSeatSlots.forEach(el => {
        const nameText = el.querySelector('.seat-name')?.innerText.toLowerCase() || '';
        if (q && nameText.includes(q) && nameText !== '[trống]') {
          el.classList.add('ring-2', 'ring-amber-400', 'bg-amber-400/20');
        } else {
          el.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-400/20');
        }
      });
    }

    function cycleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('themeIcon').textContent = next === 'dark' ? '🌙' : '☀️';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    async function exportCurrentImage() {
      const chart = document.getElementById('chartContainer');
      const btn = document.getElementById('btnExportImg');
      if (!chart) return;

      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-[10px]"></i> Đang xuất...`;
      btn.disabled = true;

      try {
        const canvas = await html2canvas(chart, { scale: 2, useCORS: true, backgroundColor: '#070913' });
        const link = document.createElement('a');
        link.download = `So_Do_Lop_7A1.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error(err);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    window.onload = function() {
      renderFrontAndPodium();
      renderClassroom();
      listenToFirebaseCloud();
    };
  </script>
</body>
</html>
